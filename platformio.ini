[env:m5stack-tab5]
platform = espressif32
board = m5stack-tab5
framework = espidf



lib_deps =
    m5stack/M5Unified @ 0.2.19
monitor_speed = 115200
upload_speed = 921600

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

build_type = release

build_flags =
    -O2
    -DBOARD_HAS_PSRAM
    -DPX68K_TAB5_DIAG_VERBOSE=0
    -DPX68K_TAB5_DIAG_GRAPHICS=0
    -DPX68K_TAB5_PERF_PROFILE=0
    -DPX68K_TAB5_DYNAREC=1
    -DPX68K_TAB5_DYNAREC_COST_PROFILE=0
    -DPX68K_TAB5_DYNAREC_PROD_BENCH=0
    -DPX68K_TAB5_DYNAREC_LOG=0
    -DPX68K_TAB5_INPUT_TRACE=0
    -DPX68K_TAB5_MIDI_TRACE=0
    -DPX68K_TAB5_AUDIO_RATE=44100
    -DPX68K_TAB5_AUDIO_VOLUME=33
    -fpermissive
    -Wl,--enable-non-contiguous-regions
# Build 6.15 Production: validated JIT/render paths retained; periodic benchmark and
# compile/reject telemetry disabled for normal release use.
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults"
# Preserve CPU0 main-task affinity/WDT while explicitly disabling retired runtime stats.
extra_scripts =
    pre:scripts/ensure_sdkconfig_release.py
    post:scripts/flash_humanxdf_595a.py
