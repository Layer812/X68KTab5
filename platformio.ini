[platformio]
default_envs = m5stack-tab5

[env:m5stack-tab5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board = m5stack-tab5
framework = espidf



lib_deps =
    m5stack/M5Unified @ 0.2.19
    m5stack/M5GFX @ 0.2.26
monitor_speed = 115200
upload_speed = 921600

board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

build_type = release

build_flags =
    # Release telemetry OFF. To restore research logs, set RELEASE_DIAGNOSTICS=1
    # and, only if wall-speed logging is needed, set DYNAREC_PROD_BENCH=1.
    -O2
    -DBOARD_HAS_PSRAM
    -DPX68K_TAB5_RELEASE_DIAGNOSTICS=0
    -DPX68K_TAB5_DIAG_VERBOSE=0
    -DPX68K_TAB5_DIAG_GRAPHICS=0
    -DPX68K_TAB5_PERF_PROFILE=0
    -DPX68K_TAB5_DYNAREC=0
    -DPX68K_TAB5_DYNAREC_COST_PROFILE=0
    -DPX68K_TAB5_DYNAREC_PROD_BENCH=0
    -DPX68K_TAB5_R43_QUIET_RUNTIME=1
    -DPX68K_TAB5_DYNAREC_LOG=0
    -DPX68K_TAB5_INPUT_TRACE=0
    -DPX68K_TAB5_MIDI_TRACE=0
    -DPX68K_TAB5_AUDIO_RATE=44100
    -DPX68K_TAB5_AUDIO_VOLUME=33
    -fpermissive
    -Wl,--enable-non-contiguous-regions
# Build 6.15h17-dbfb: stable h14 HP/audio baseline + Tab5 DSI double framebuffer.
# M5GFX 0.2.26 is patched at build time to request two ESP-IDF DPI framebuffers; LP remains disabled.
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults"
# Preserve CPU0 main-task affinity/WDT while explicitly disabling retired runtime stats.
extra_scripts =
    pre:scripts/ensure_sdkconfig_release.py
    pre:scripts/patch_m5gfx_dsi_doublefb.py
    post:scripts/flash_humanxdf_595a.py


; -----------------------------------------------------------------------------
; Experimental Turbo profile for original Tab5 / ESP32-P4 rev1.x.
; Standard remains the default and byte-for-byte feature flags are inherited.
; The IDF Kconfig remains at the validated 360 MHz boot setting; Turbo switches
; only the HP CPU clock at the very start of app_main and verifies the result.
; Guest X68000 timing stays at 10 MHz. PSRAM/Flash/LCD clocks are unchanged.
; -----------------------------------------------------------------------------
[env:m5stack-tab5-turbo400]
extends = env:m5stack-tab5
build_flags =
    ${env:m5stack-tab5.build_flags}
    -DPX68K_TAB5_P4_TURBO400=1
    -DPX68K_TAB5_HOST_CPU_MHZ=400
